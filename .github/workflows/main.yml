name: Unpack ITXN zip to main

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Create extraction dir
        run: mkdir -p itxn_final_v3_3_extracted

      - name: Unzip archive
        run: |
          if [ -f "ITXN_MOBILE_LAB_PATCHED_v3_3.zip" ]; then
            unzip -o ITXN_MOBILE_LAB_PATCHED_v3_3.zip -d itxn_final_v3_3_extracted
          else
            echo "ERROR: ZIP file not found in repo root!" >&2
            ls -la
            exit 1
          fi

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itxn_final_v3_3_extracted
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add extracted contents of ITXN_MOBILE_LAB_PATCHED_v3_3.zip"
          git push origin HEAD:main
          
