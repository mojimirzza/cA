name: Unpack ITXN zip to main

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Create extraction dir
        run: mkdir -p itxn_final_v3_3_extracted

      - name: Verify ZIP
        run: |
          ls -la ITXN_MOBILE_LAB_PATCHED_v3_3.zip
          file ITXN_MOBILE_LAB_PATCHED_v3_3.zip

      - name: Unzip archive
        run: |
          unzip -o ITXN_MOBILE_LAB_PATCHED_v3_3.zip -d itxn_final_v3_3_extracted

      - name: Commit extracted files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itxn_final_v3_3_extracted || true
          git commit -m "Add extracted contents from ZIP" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push failed"
          
