name: Unpack ITXN zip to main

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Create extraction dir
        run: mkdir -p itxn_final_v3_3_extracted

      - name: Find and unzip archive
        run: |
          echo "Files in repo root:"
          ls -la
          ZIPFILE=$(ls -1 *.zip 2>/dev/null | head -1)
          if [ -z "$ZIPFILE" ]; then
            echo "ERROR: No .zip file found!" >&2
            exit 1
          fi
          echo "Found ZIP: $ZIPFILE"
          unzip -o "$ZIPFILE" -d itxn_final_v3_3_extracted

      - name: Commit extracted files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itxn_final_v3_3_extracted || true
          git commit -m "Add extracted contents from ZIP" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push failed"
          
